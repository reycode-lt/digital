<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Verify Email • ReyCode Digital</title>

    <style>
        *{box-sizing:border-box}

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            font-family:Inter,Arial,sans-serif;
            color:#fff;
            background:
                radial-gradient(circle at 20% 20%,rgba(49,133,255,.16),transparent 30%),
                radial-gradient(circle at 80% 80%,rgba(49,133,255,.10),transparent 32%),
                #05070a;
        }

        .card{
            width:100%;
            max-width:430px;
            padding:34px;
            text-align:center;
            border:1px solid rgba(255,255,255,.09);
            border-radius:24px;
            background:rgba(12,16,22,.72);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            box-shadow:0 30px 80px rgba(0,0,0,.45);
        }

        .logo{
            width:52px;
            height:52px;
            margin:0 auto 22px;
            padding:7px;
            border-radius:16px;
            background:rgba(255,255,255,.05);
            border:1px solid rgba(255,255,255,.08);
        }

        .logo img{
            width:100%;
            height:100%;
            object-fit:contain;
        }

        .icon{
            width:64px;
            height:64px;
            margin:0 auto 20px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:20px;
            background:rgba(49,133,255,.08);
            border:1px solid rgba(49,133,255,.16);
            color:#3185ff;
            font-size:28px;
        }

        h1{
            margin:0;
            font-size:27px;
            letter-spacing:-.8px;
        }

        .text{
            margin:12px 0 25px;
            color:#7f8996;
            font-size:13px;
            line-height:1.7;
        }

        .message{
            padding:13px 15px;
            border-radius:12px;
            font-size:12px;
            line-height:1.5;
            background:rgba(255,255,255,.035);
            border:1px solid rgba(255,255,255,.07);
            color:#aeb7c3;
        }

        .message.success{
            background:rgba(49,133,255,.08);
            border-color:rgba(49,133,255,.18);
            color:#75adff;
        }

        .message.error{
            background:rgba(255,70,70,.08);
            border-color:rgba(255,70,70,.16);
            color:#ff8d8d;
        }

        a{
            display:inline-block;
            margin-top:22px;
            color:#3185ff;
            text-decoration:none;
            font-size:12px;
        }

        .loading{
            width:24px;
            height:24px;
            margin:0 auto 20px;
            border:3px solid rgba(255,255,255,.12);
            border-top-color:#3185ff;
            border-radius:50%;
            animation:spin .7s linear infinite;
        }

        @keyframes spin{
            to{transform:rotate(360deg)}
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        <img
            src="https://i.top4top.io/p_3925af3h26.png"
            alt="ReyCode"
        >
    </div>

    <div id="loading" class="loading"></div>

    <div id="icon" class="icon" style="display:none;">
        ✓
    </div>

    <h1 id="title">
        Verifying email
    </h1>

    <div id="text" class="text">
        Sedang memverifikasi email akun kamu...
    </div>

    <div id="message" class="message">
        Mohon tunggu sebentar.
    </div>

    <a id="loginLink" href="/login" style="display:none;">
        Kembali ke login
    </a>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");

const loading = document.getElementById("loading");
const icon = document.getElementById("icon");
const title = document.getElementById("title");
const text = document.getElementById("text");
const message = document.getElementById("message");
const loginLink = document.getElementById("loginLink");

async function verifyEmail() {
    if (!token) {
        showError("Token verifikasi tidak ditemukan.");
        return;
    }

    try {
        const response = await fetch(
            `/api/auth/verify?token=${encodeURIComponent(token)}`
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Verifikasi email gagal"
            );
        }

        loading.style.display = "none";
        icon.style.display = "flex";

        title.textContent = "Email verified";
        text.textContent =
            "Email akun ReyCode Digital kamu berhasil diverifikasi.";

        message.textContent =
            "Akun kamu sekarang sudah aktif dan siap digunakan.";

        message.className = "message success";
        loginLink.style.display = "inline-block";

    } catch (error) {
        showError(
            error.message || "Token tidak valid atau sudah kedaluwarsa."
        );
    }
}

function showError(textMessage) {
    loading.style.display = "none";

    icon.style.display = "flex";
    icon.textContent = "×";
    icon.style.color = "#ff6b6b";
    icon.style.background = "rgba(255,70,70,.08)";
    icon.style.borderColor = "rgba(255,70,70,.16)";

    title.textContent = "Verification failed";

    text.textContent =
        "Kami tidak dapat memverifikasi email kamu.";

    message.textContent = textMessage;
    message.className = "message error";

    loginLink.style.display = "inline-block";
}

verifyEmail();
</script>

</body>
</html>
