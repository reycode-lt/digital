<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#08090d">
    <title>Alight Motion - ReyCode Digital</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #07080c;
            --card: rgba(15, 17, 24, .78);
            --card-solid: #10121a;
            --input: rgba(7, 9, 14, .86);
            --border: rgba(255, 255, 255, .08);
            --border-hover: rgba(255, 255, 255, .15);
            --text: #f7f8fb;
            --muted: #858b9d;
            --muted-2: #606678;
            --accent: #8b7cff;
            --accent-2: #b8a8ff;
            --success: #59e6a7;
            --danger: #ff7183;
            --shadow: 0 30px 90px rgba(0, 0, 0, .35);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: var(--text);
            background:
                radial-gradient(
                    800px 500px at -10% -10%,
                    rgba(111, 92, 255, .18),
                    transparent 60%
                ),
                radial-gradient(
                    700px 450px at 110% 15%,
                    rgba(145, 86, 255, .11),
                    transparent 60%
                ),
                radial-gradient(
                    600px 400px at 50% 100%,
                    rgba(63, 108, 255, .07),
                    transparent 60%
                ),
                var(--bg);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.018) 1px,
                    transparent 1px
                );
            background-size: 42px 42px;
            mask-image: linear-gradient(
                to bottom,
                black,
                transparent 75%
            );
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: min(100% - 32px, 920px);
            margin: auto;
            padding: 42px 0 70px;
            position: relative;
            z-index: 1;
        }

        .top {
            margin-bottom: 25px;
            animation: fadeUp .5s ease both;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #aaa2ff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .14em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .eyebrow::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 18px rgba(139,124,255,.8);
        }

        .hello {
            font-size: clamp(28px, 5vw, 40px);
            line-height: 1.05;
            font-weight: 850;
            letter-spacing: -.045em;
            background: linear-gradient(
                135deg,
                #fff 20%,
                #cfcaff 70%,
                #9d91ff
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            margin-top: 11px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .card {
            position: relative;
            border: 1px solid var(--border);
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.012)
                ),
                var(--card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
            animation: fadeUp .55s ease both;
        }

        .card::before {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            top: -110px;
            right: -70px;
            border-radius: 50%;
            background: rgba(139,124,255,.09);
            filter: blur(8px);
            pointer-events: none;
        }

        .title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        .desc {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            padding: 5px;
            margin-bottom: 21px;
            border: 1px solid var(--border);
            background: rgba(5, 7, 11, .62);
            border-radius: 15px;
        }

        .tab {
            position: relative;
            border: 0;
            background: transparent;
            color: var(--muted);
            border-radius: 11px;
            padding: 12px 14px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 750;
            transition:
                color .2s ease,
                background .2s ease,
                transform .2s ease;
        }

        .tab:hover {
            color: #fff;
        }

        .tab.active {
            color: #fff;
            background:
                linear-gradient(
                    135deg,
                    rgba(139,124,255,.22),
                    rgba(139,124,255,.08)
                );
            box-shadow:
                inset 0 0 0 1px rgba(139,124,255,.18),
                0 8px 25px rgba(0,0,0,.15);
        }

        .panel {
            display: none;
            animation: panelIn .25s ease both;
        }

        .panel.active {
            display: block;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 700;
            color: #c8cbd5;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            border: 1px solid var(--border);
            background: var(--input);
            color: #fff;
            border-radius: 13px;
            padding: 13px 14px;
            outline: none;
            font-size: 13px;
            transition:
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        input::placeholder {
            color: #555b6d;
        }

        input:hover {
            border-color: var(--border-hover);
        }

        input:focus {
            border-color: rgba(139,124,255,.7);
            background: rgba(8,10,16,.98);
            box-shadow:
                0 0 0 4px rgba(139,124,255,.08),
                0 12px 35px rgba(0,0,0,.18);
        }

        .buttons {
            display: flex;
            gap: 9px;
            flex-wrap: wrap;
        }

        .btn {
            position: relative;
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 11px 17px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
            transition:
                transform .2s ease,
                box-shadow .2s ease,
                background .2s ease,
                border-color .2s ease;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn.primary {
            color: #fff;
            background:
                linear-gradient(
                    135deg,
                    #9b8cff,
                    #705fff
                );
            box-shadow:
                0 10px 28px rgba(112,95,255,.22),
                inset 0 1px 0 rgba(255,255,255,.2);
        }

        .btn.primary:hover:not(:disabled) {
            box-shadow:
                0 14px 34px rgba(112,95,255,.3),
                inset 0 1px 0 rgba(255,255,255,.2);
        }

        .btn.secondary {
            background: rgba(255,255,255,.045);
            border-color: var(--border);
            color: #e8e9ef;
        }

        .btn.secondary:hover:not(:disabled) {
            background: rgba(255,255,255,.075);
            border-color: var(--border-hover);
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none !important;
        }

        .status {
            display: none;
            padding: 12px 14px;
            border-radius: 13px;
            margin-top: 15px;
            font-size: 12px;
            line-height: 1.55;
            animation: fadeIn .2s ease both;
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: rgba(43,194,125,.08);
            color: #6be8b0;
            border: 1px solid rgba(43,194,125,.17);
        }

        .status.error {
            background: rgba(255,74,95,.07);
            color: #ff8d9b;
            border: 1px solid rgba(255,74,95,.16);
        }

        .result {
            display: none;
            margin-top: 18px;
            border: 1px solid var(--border);
            background: rgba(5,7,12,.65);
            border-radius: 16px;
            padding: 18px;
            animation: panelIn .25s ease both;
        }

        .result.show {
            display: block;
        }

        .result-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .result-title::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 14px rgba(89,230,167,.6);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 11px 0;
            border-bottom: 1px solid rgba(255,255,255,.055);
            font-size: 12px;
        }

        .result-row:last-child {
            border-bottom: 0;
            padding-bottom: 0;
        }

        .result-label {
            color: var(--muted-2);
        }

        .result-value {
            text-align: right;
            color: #e7e8ee;
            word-break: break-word;
            font-weight: 600;
        }

        .history-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 17px;
        }

        .history-list {
            display: grid;
            gap: 10px;
        }

        .history-item {
            position: relative;
            border: 1px solid var(--border);
            background: rgba(6,8,13,.58);
            border-radius: 16px;
            padding: 16px;
            transition:
                border-color .2s ease,
                transform .2s ease,
                background .2s ease;
        }

        .history-item:hover {
            border-color: rgba(139,124,255,.2);
            background: rgba(10,12,19,.75);
            transform: translateY(-1px);
        }

        .history-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .history-email {
            font-size: 13px;
            font-weight: 750;
            line-height: 1.5;
            word-break: break-word;
            color: #e9eaf0;
        }

        .badge {
            flex: 0 0 auto;
            font-size: 10px;
            font-weight: 850;
            letter-spacing: .05em;
            padding: 5px 8px;
            border-radius: 999px;
            background: rgba(43,194,125,.09);
            color: var(--success);
            border: 1px solid rgba(43,194,125,.12);
        }

        .badge.failed {
            background: rgba(255,74,95,.08);
            color: var(--danger);
            border-color: rgba(255,74,95,.13);
        }

        .history-meta {
            color: #777d90;
            font-size: 11px;
            line-height: 1.85;
        }

        .empty {
            text-align: center;
            color: #6f7587;
            padding: 32px 10px;
            font-size: 12px;
            border: 1px dashed var(--border);
            border-radius: 15px;
            background: rgba(255,255,255,.012);
        }

        .loading {
            opacity: .7;
            pointer-events: none;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes panelIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            .container {
                width: min(100% - 20px, 920px);
                padding-top: 24px;
                padding-bottom: 45px;
            }

            .top {
                margin-bottom: 20px;
            }

            .card {
                padding: 18px;
                border-radius: 18px;
            }

            .hello {
                font-size: 29px;
            }

            .subtitle {
                font-size: 13px;
            }

            .history-head {
                align-items: center;
            }

            .history-head .btn {
                padding: 10px 13px;
            }

            .result-row {
                display: block;
            }

            .result-value {
                text-align: left;
                margin-top: 5px;
            }
        }

        @media (max-width: 390px) {
            .container {
                width: min(100% - 16px, 920px);
            }

            .card {
                padding: 15px;
            }

            .history-head {
                align-items: flex-start;
                flex-direction: column;
            }

            .history-head .btn {
                width: 100%;
            }

            .buttons .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="top">
        <div class="eyebrow">ReyCode Digital</div>

        <div
            class="hello"
            id="greeting"
        >
            Halo 👋
        </div>

        <div class="subtitle">
            Kelola Alight Motion dengan cepat, aman, dan praktis.
        </div>
    </div>

    <div class="card">

        <div class="title">
            Alight Motion
        </div>

        <div class="desc">
            Pilih metode aktivasi yang ingin kamu gunakan.
        </div>

        <div class="tabs">

            <button
                class="tab active"
                data-tab="manual"
                type="button"
            >
                Manual
            </button>

            <button
                class="tab"
                data-tab="auto"
                type="button"
            >
                Auto
            </button>

        </div>

        <div
            class="panel active"
            id="manual"
        >

            <div class="field">
                <label for="manualEmail">
                    Email
                </label>

                <input
                    id="manualEmail"
                    type="email"
                    placeholder="contoh@email.com"
                    autocomplete="email"
                >
            </div>

            <div class="buttons">

                <button
                    class="btn secondary"
                    id="sendLinkBtn"
                    type="button"
                >
                    Kirim Link
                </button>

            </div>

            <div
                class="field"
                style="margin-top:15px"
            >
                <label for="magicLink">
                    Link Verifikasi
                </label>

                <input
                    id="magicLink"
                    type="url"
                    placeholder="Tempel link verifikasi di sini"
                >
            </div>

            <div class="buttons">

                <button
                    class="btn primary"
                    id="verifyBtn"
                    type="button"
                >
                    Verify
                </button>

            </div>

            <div
                class="status"
                id="manualStatus"
            ></div>

        </div>

        <div
            class="panel"
            id="auto"
        >

            <div class="field">
                <label for="autoUsername">
                    Nama / Username
                    <span style="color:#777c8e">
                        (opsional)
                    </span>
                </label>

                <input
                    id="autoUsername"
                    type="text"
                    placeholder="Kosongkan untuk nama random"
                    maxlength="50"
                >
            </div>

            <div class="buttons">

                <button
                    class="btn primary"
                    id="autoBtn"
                    type="button"
                >
                    Auto Activate
                </button>

            </div>

            <div
                class="status"
                id="autoStatus"
            ></div>

            <div
                class="result"
                id="autoResult"
            >
                <div class="result-title">
                    Aktivasi Berhasil
                </div>

                <div class="result-row">
                    <div class="result-label">
                        Email
                    </div>

                    <div
                        class="result-value"
                        id="resultEmail"
                    >
                        -
                    </div>
                </div>

                <div class="result-row">
                    <div class="result-label">
                        Animal
                    </div>

                    <div
                        class="result-value"
                        id="resultAnimal"
                    >
                        -
                    </div>
                </div>

                <div class="result-row">
                    <div class="result-label">
                        Order ID
                    </div>

                    <div
                        class="result-value"
                        id="resultOrder"
                    >
                        -
                    </div>
                </div>

                <div class="result-row">
                    <div class="result-label">
                        Berlaku Sampai
                    </div>

                    <div
                        class="result-value"
                        id="resultValid"
                    >
                        -
                    </div>
                </div>

                <div class="result-row">
                    <div class="result-label">
                        Website
                    </div>

                    <div
                        class="result-value"
                        id="resultWeb"
                    >
                        -
                    </div>
                </div>
            </div>

        </div>

    </div>

    <div class="card">

        <div class="history-head">

            <div>
                <div class="title">
                    History
                </div>

                <div class="desc">
                    Riwayat proses akun kamu.
                </div>
            </div>

            <button
                class="btn secondary"
                id="refreshHistory"
                type="button"
            >
                Refresh
            </button>

        </div>

        <div
            class="history-list"
            id="historyList"
        >
            <div class="empty">
                Memuat history...
            </div>
        </div>

    </div>

</div>

<script>
const $ = id => document.getElementById(id);

function showStatus(element, message, type) {
    element.textContent = message;
    element.className =
        "status show " + type;
}

function clearStatus(element) {
    element.textContent = "";
    element.className = "status";
}

async function loadUser() {
    try {
        const response = await fetch(
            "/api/user/me",
            {
                credentials: "include"
            }
        );

        if (!response.ok) {
            location.href = "/login.html";
            return;
        }

        const data =
            await response.json();

        const user =
            data.user || data.data || data;

        const name =
            user.name ||
            user.username ||
            "User";

        $("greeting").textContent =
            `Halo, ${name} 👋`;
    } catch {
        $("greeting").textContent =
            "Halo 👋";
    }
}

async function sendLink() {
    const email =
        $("manualEmail").value.trim();

    if (!email) {
        showStatus(
            $("manualStatus"),
            "Email wajib diisi.",
            "error"
        );
        return;
    }

    const button =
        $("sendLinkBtn");

    button.disabled = true;
    button.textContent =
        "Mengirim...";

    clearStatus(
        $("manualStatus")
    );

    try {
        const response =
            await fetch(
                "/api/alightmotion",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        action: "send-link",
                        email
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.status) {
            throw new Error(
                data.error ||
                data.message ||
                "Gagal mengirim link."
            );
        }

        showStatus(
            $("manualStatus"),
            data.message ||
            "Tautan verifikasi berhasil dikirim.",
            "success"
        );
    } catch (error) {
        showStatus(
            $("manualStatus"),
            error.message,
            "error"
        );
    } finally {
        button.disabled = false;
        button.textContent =
            "Kirim Link";
    }
}

async function verifyLink() {
    const email =
        $("manualEmail").value.trim();

    const magicLink =
        $("magicLink").value.trim();

    if (!email) {
        showStatus(
            $("manualStatus"),
            "Email wajib diisi.",
            "error"
        );
        return;
    }

    if (!magicLink) {
        showStatus(
            $("manualStatus"),
            "Link verifikasi wajib diisi.",
            "error"
        );
        return;
    }

    const button =
        $("verifyBtn");

    button.disabled = true;
    button.textContent =
        "Memproses...";

    clearStatus(
        $("manualStatus")
    );

    try {
        const response =
            await fetch(
                "/api/alightmotion",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        action: "verify-link",
                        email,
                        magicLink
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.status) {
            throw new Error(
                data.error ||
                data.message ||
                "Verifikasi gagal."
            );
        }

        const orderId =
            data.data?.orderId;

        showStatus(
            $("manualStatus"),
            orderId
                ? `Berhasil diverifikasi. Order ID: ${orderId}`
                : "Berhasil diverifikasi.",
            "success"
        );

        await loadHistory();
    } catch (error) {
        showStatus(
            $("manualStatus"),
            error.message,
            "error"
        );

        await loadHistory();
    } finally {
        button.disabled = false;
        button.textContent =
            "Verify";
    }
}

async function autoActivate() {
    const username =
        $("autoUsername").value.trim();

    const button =
        $("autoBtn");

    button.disabled = true;
    button.textContent =
        "Memproses...";

    clearStatus(
        $("autoStatus")
    );

    $("autoResult")
        .classList
        .remove("show");

    try {
        const response =
            await fetch(
                "/api/alightmotion",
                {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type":
                            "application/json"
                    },
                    body: JSON.stringify({
                        action: "auto",
                        ...(username
                            ? { username }
                            : {})
                    })
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.status ||
            !data.card
        ) {
            throw new Error(
                data.error ||
                data.message ||
                "Auto gagal."
            );
        }

        const card = data.card;

        $("resultEmail").textContent =
            card.email || "-";

        $("resultAnimal").textContent =
            card
                .selamat_kamu_mendapatkan_animal ||
            "-";

        $("resultOrder").textContent =
            card.orderId || "-";

        $("resultValid").textContent =
            card.validUntil || "-";

        $("resultWeb").textContent =
            card.weblogin || "-";

        $("autoResult")
            .classList
            .add("show");

        showStatus(
            $("autoStatus"),
            "Berhasil membuat akun.",
            "success"
        );

        await loadHistory();
    } catch (error) {
        showStatus(
            $("autoStatus"),
            error.message,
            "error"
        );

        await loadHistory();
    } finally {
        button.disabled = false;
        button.textContent =
            "Auto Activate";
    }
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatDate(value) {
    if (!value) return "-";

    const date =
        new Date(value);

    if (Number.isNaN(date.getTime())) {
        return value;
    }

    return date.toLocaleString(
        "id-ID",
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );
}

async function loadHistory() {
    const list =
        $("historyList");

    list.innerHTML =
        `<div class="empty">Memuat history...</div>`;

    try {
        const response =
            await fetch(
                "/api/alightmotion/history",
                {
                    credentials: "include"
                }
            );

        if (response.status === 401) {
            location.href =
                "/login.html";
            return;
        }

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {
            throw new Error(
                data.message ||
                "Gagal mengambil history."
            );
        }

        const history =
            Array.isArray(data.history)
                ? data.history
                : [];

        if (!history.length) {
            list.innerHTML =
                `<div class="empty">
                    Belum ada history.
                </div>`;
            return;
        }

        list.innerHTML =
            history.map(item => {
                const failed =
                    item.status === "failed";

                return `
                    <div class="history-item">
                        <div class="history-top">
                            <div class="history-email">
                                ${escapeHtml(
                                    item.email ||
                                    item.username ||
                                    "-"
                                )}
                            </div>

                            <div class="badge ${
                                failed
                                    ? "failed"
                                    : ""
                            }">
                                ${
                                    failed
                                        ? "FAILED"
                                        : "SUCCESS"
                                }
                            </div>
                        </div>

                        <div class="history-meta">
                            Mode:
                            ${escapeHtml(
                                item.action
                            )}
                            <br>

                            ${
                                item.orderId
                                    ? `Order:
                                        ${escapeHtml(
                                            item.orderId
                                        )}<br>`
                                    : ""
                            }

                            ${
                                item.validUntil
                                    ? `Valid:
                                        ${escapeHtml(
                                            item.validUntil
                                        )}<br>`
                                    : ""
                            }

                            Dibuat:
                            ${escapeHtml(
                                formatDate(
                                    item.createdAt
                                )
                            )}

                            ${
                                failed &&
                                item.error
                                    ? `<br>Error:
                                        ${escapeHtml(
                                            item.error
                                        )}`
                                    : ""
                            }
                        </div>
                    </div>
                `;
            }).join("");
    } catch (error) {
        list.innerHTML =
            `<div class="empty">
                ${escapeHtml(
                    error.message
                )}
            </div>`;
    }
}

document
    .querySelectorAll(".tab")
    .forEach(tab => {
        tab.addEventListener(
            "click",
            () => {
                document
                    .querySelectorAll(".tab")
                    .forEach(item =>
                        item.classList
                            .remove("active")
                    );

                document
                    .querySelectorAll(".panel")
                    .forEach(item =>
                        item.classList
                            .remove("active")
                    );

                tab.classList
                    .add("active");

                const target =
                    $(tab.dataset.tab);

                if (target) {
                    target.classList
                        .add("active");
                }
            }
        );
    });
