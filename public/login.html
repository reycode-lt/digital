<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="theme-color" content="#070a0f">
    <title>Login • ReyCode Digital</title>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        :root{
            --bg:#070a0f;
            --panel:rgba(13,17,24,.78);
            --border:rgba(255,255,255,.08);
            --text:#f5f7fa;
            --muted:#7d8795;
            --muted-2:#596371;
            --blue:#3185ff;
            --blue-light:#69a8ff;
        }

        html{
            min-height:100%;
            background:var(--bg);
        }

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            overflow-x:hidden;
            font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
            color:var(--text);
            background:
                radial-gradient(circle at 8% 12%,rgba(49,133,255,.18),transparent 28%),
                radial-gradient(circle at 92% 88%,rgba(49,133,255,.13),transparent 30%),
                radial-gradient(circle at 50% -15%,rgba(75,145,255,.08),transparent 35%),
                #070a0f;
        }

        body::before{
            content:"";
            position:fixed;
            inset:0;
            pointer-events:none;
            opacity:.28;
            background-image:
                linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
            background-size:48px 48px;
            mask-image:linear-gradient(to bottom,black,transparent 85%);
        }

        .orb{
            position:fixed;
            width:320px;
            height:320px;
            border-radius:50%;
            pointer-events:none;
            filter:blur(90px);
            opacity:.16;
            background:#3185ff;
            animation:float 9s ease-in-out infinite;
        }

        .orb.one{
            top:-190px;
            left:-120px;
        }

        .orb.two{
            right:-160px;
            bottom:-190px;
            animation-delay:-4s;
        }

        .wrapper{
            position:relative;
            width:100%;
            max-width:440px;
            animation:cardIn .65s cubic-bezier(.2,.8,.2,1);
        }

        .card{
            position:relative;
            padding:38px;
            overflow:hidden;
            border:1px solid var(--border);
            border-radius:28px;
            background:
                linear-gradient(145deg,rgba(255,255,255,.045),transparent 35%),
                var(--panel);
            backdrop-filter:blur(30px);
            -webkit-backdrop-filter:blur(30px);
            box-shadow:
                0 40px 100px rgba(0,0,0,.5),
                inset 0 1px 0 rgba(255,255,255,.045);
        }

        .card::before{
            content:"";
            position:absolute;
            top:0;
            left:12%;
            right:12%;
            height:1px;
            background:linear-gradient(
                90deg,
                transparent,
                rgba(83,157,255,.8),
                transparent
            );
        }

        .brand{
            display:flex;
            flex-direction:column;
            align-items:center;
            margin-bottom:30px;
        }

        .logo{
            position:relative;
            width:66px;
            height:66px;
            display:flex;
            align-items:center;
            justify-content:center;
            margin-bottom:18px;
            padding:9px;
            border:1px solid rgba(255,255,255,.1);
            border-radius:20px;
            background:
                linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));
            box-shadow:
                0 18px 40px rgba(0,0,0,.3),
                0 0 35px rgba(49,133,255,.08);
        }

        .logo::before{
            content:"";
            position:absolute;
            inset:-7px;
            border-radius:24px;
            border:1px solid rgba(49,133,255,.08);
        }

        .logo img{
            width:100%;
            height:100%;
            object-fit:contain;
        }

        .eyebrow{
            margin-bottom:8px;
            color:var(--blue-light);
            font-size:10px;
            font-weight:800;
            letter-spacing:2.2px;
            text-transform:uppercase;
        }

        h1{
            color:#fff;
            font-size:30px;
            font-weight:750;
            letter-spacing:-1.2px;
            line-height:1.15;
            text-align:center;
        }

        .subtitle{
            margin-top:10px;
            color:var(--muted);
            font-size:13px;
            line-height:1.6;
            text-align:center;
        }

        .message{
            display:none;
            align-items:center;
            gap:10px;
            margin-bottom:20px;
            padding:13px 14px;
            border-radius:14px;
            font-size:12px;
            line-height:1.5;
            animation:messageIn .25s ease;
        }

        .message::before{
            content:"";
            width:7px;
            height:7px;
            flex:0 0 7px;
            border-radius:50%;
            background:currentColor;
            box-shadow:0 0 12px currentColor;
        }

        .message.error{
            display:flex;
            color:#ff8f98;
            border:1px solid rgba(255,82,96,.14);
            background:rgba(255,67,80,.07);
        }

        .message.success{
            display:flex;
            color:#78b1ff;
            border:1px solid rgba(49,133,255,.16);
            background:rgba(49,133,255,.07);
        }

        .field{
            margin-bottom:18px;
        }

        label{
            display:flex;
            align-items:center;
            margin-bottom:8px;
            color:#aeb7c3;
            font-size:11px;
            font-weight:650;
            letter-spacing:.15px;
        }

        .input-wrap{
            position:relative;
        }

        .input-icon{
            position:absolute;
            top:50%;
            left:15px;
            width:17px;
            height:17px;
            transform:translateY(-50%);
            color:#687382;
            pointer-events:none;
            transition:.2s ease;
        }

        .input-icon svg{
            width:100%;
            height:100%;
            fill:none;
            stroke:currentColor;
            stroke-width:1.7;
            stroke-linecap:round;
            stroke-linejoin:round;
        }

        input{
            width:100%;
            height:52px;
            padding:0 15px 0 45px;
            outline:none;
            border:1px solid rgba(255,255,255,.085);
            border-radius:14px;
            background:rgba(255,255,255,.035);
            color:#fff;
            font-family:inherit;
            font-size:13px;
            transition:
                border-color .2s ease,
                background .2s ease,
                box-shadow .2s ease,
                transform .2s ease;
        }

        input::placeholder{
            color:#4e5865;
        }

        input:hover{
            border-color:rgba(255,255,255,.13);
            background:rgba(255,255,255,.045);
        }

        input:focus{
            border-color:rgba(49,133,255,.65);
            background:rgba(49,133,255,.035);
            box-shadow:
                0 0 0 4px rgba(49,133,255,.08),
                0 8px 25px rgba(0,0,0,.12);
        }

        input:focus + .input-icon{
            color:var(--blue-light);
        }

        .password-wrap{
            position:relative;
        }

        .password-wrap input{
            padding-right:15px;
        }

        .row{
            display:flex;
            justify-content:flex-end;
            margin:-2px 0 22px;
        }

        a{
            color:var(--blue-light);
            text-decoration:none;
            font-size:11px;
            font-weight:600;
            transition:.2s ease;
        }

        a:hover{
            color:#9cc7ff;
        }

        button{
            position:relative;
            width:100%;
            height:52px;
            overflow:hidden;
            border:0;
            border-radius:14px;
            background:
                linear-gradient(
                    135deg,
                    #246fe0 0%,
                    #3185ff 48%,
                    #4b96ff 100%
                );
            color:#fff;
            font-family:inherit;
            font-size:12px;
            font-weight:800;
            letter-spacing:.8px;
            cursor:pointer;
            box-shadow:
                0 12px 28px rgba(49,133,255,.2),
                inset 0 1px 0 rgba(255,255,255,.18);
            transition:
                transform .2s ease,
                box-shadow .2s ease,
                filter .2s ease;
        }

        button::before{
            content:"";
            position:absolute;
            top:0;
            left:-120%;
            width:70%;
            height:100%;
            transform:skewX(-20deg);
            background:linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.2),
                transparent
            );
            transition:left .65s ease;
        }

        button:hover{
            transform:translateY(-2px);
            filter:brightness(1.05);
            box-shadow:
                0 17px 35px rgba(49,133,255,.27),
                inset 0 1px 0 rgba(255,255,255,.2);
        }

        button:hover::before{
            left:140%;
        }

        button:active{
            transform:translateY(0);
        }

        button:disabled{
            opacity:.72;
            cursor:wait;
            transform:none;
            filter:none;
        }

        .bottom{
            display:flex;
            align-items:center;
            gap:14px;
            margin:26px 0 0;
        }

        .bottom::before,
        .bottom::after{
            content:"";
            height:1px;
            flex:1;
            background:rgba(255,255,255,.07);
        }

        .bottom span{
            color:#596371;
            font-size:10px;
            white-space:nowrap;
        }

        .register{
            margin-top:18px;
            text-align:center;
            color:#737e8b;
            font-size:12px;
        }

        .register a{
            margin-left:3px;
        }

        .secure{
            display:flex;
            justify-content:center;
            align-items:center;
            gap:7px;
            margin-top:22px;
            color:#4e5967;
            font-size:10px;
        }

        .secure svg{
            width:13px;
            height:13px;
            fill:none;
            stroke:#5c6876;
            stroke-width:1.7;
            stroke-linecap:round;
            stroke-linejoin:round;
        }

        .loading{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:9px;
        }

        .spinner{
            width:15px;
            height:15px;
            border:2px solid rgba(255,255,255,.25);
            border-top-color:#fff;
            border-radius:50%;
            animation:spin .7s linear infinite;
        }

        @keyframes spin{
            to{transform:rotate(360deg)}
        }

        @keyframes float{
            0%,100%{
                transform:translate3d(0,0,0);
            }
            50%{
                transform:translate3d(25px,18px,0);
            }
        }

        @keyframes cardIn{
            from{
                opacity:0;
                transform:translateY(18px) scale(.985);
            }
            to{
                opacity:1;
                transform:translateY(0) scale(1);
            }
        }

        @keyframes messageIn{
            from{
                opacity:0;
                transform:translateY(-4px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        @media(max-width:520px){
            body{
                padding:16px;
            }

            .card{
                padding:30px 22px;
                border-radius:23px;
            }

            .logo{
                width:60px;
                height:60px;
                border-radius:18px;
            }

            h1{
                font-size:27px;
            }
        }

        @media(prefers-reduced-motion:reduce){
            *,
            *::before,
            *::after{
                animation:none!important;
                transition:none!important;
            }
        }
    </style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>

<main class="wrapper">
    <section class="card">

        <div class="brand">
            <div class="logo">
                <img src="https://i.top4top.io/p_3925af3h26.png" alt="ReyCode">
            </div>

            <div class="eyebrow">ReyCode Digital</div>
            <h1>Welcome back</h1>
            <div class="subtitle">
                Masuk ke akun Anda untuk melanjutkan.
            </div>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="field">
                <label for="email">Email</label>

                <div class="input-wrap">
                    <input
                        id="email"
                        type="email"
                        placeholder="nama@email.com"
                        autocomplete="email"
                        required
                    >

                    <span class="input-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="14" rx="3"></rect>
                            <path d="m4 7 8 6 8-6"></path>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>

                <div class="input-wrap">
                    <input
                        id="password"
                        type="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                    <span class="input-icon">
                        <svg viewBox="0 0 24 24">
                            <rect x="4" y="10" width="16" height="11" rx="2.5"></rect>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                            <path d="M12 14v3"></path>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="row">
                <a href="/forgot-password">Lupa password?</a>
            </div>

            <button id="submitButton" type="submit">
                LOGIN
            </button>

        </form>

        <div class="bottom">
            <span>AKSES AKUN</span>
        </div>

        <div class="register">
            Belum punya akun?
            <a href="/register">Daftar sekarang</a>
        </div>

        <div class="secure">
            <svg viewBox="0 0 24 24">
                <path d="M12 3 19 6v5c0 4.6-2.9 8.2-7 10-4.1-1.8-7-5.4-7-10V6l7-3Z"></path>
                <path d="m9 12 2 2 4-4"></path>
            </svg>
            Sistem login terlindungi
        </div>

    </section>
</main>

<script>
const form = document.getElementById("loginForm");
const button = document.getElementById("submitButton");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = `message ${type}`;
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;

    button.innerHTML = `
        <span class="loading">
            <span class="spinner"></span>
            Memproses...
        </span>
    `;

    message.className = "message";

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
                email,
                password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Login gagal"
            );
        }

        showMessage(
            "Login berhasil. Mengalihkan...",
            "success"
        );

        setTimeout(() => {
            window.location.href = "/dashboard";
        }, 700);

    } catch (error) {
        showMessage(
            error.message || "Terjadi kesalahan",
            "error"
        );

        button.disabled = false;
        button.textContent = "LOGIN";
    }
});
</script>

</body>
</html>
