<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Login • ReyCode Digital</title>
    <style>
        *{box-sizing:border-box}
        body{
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:24px;
            font-family:Inter,Arial,sans-serif;
            color:#fff;
            background:
                radial-gradient(circle at 20% 20%,rgba(49,133,255,.16),transparent 30%),
                radial-gradient(circle at 80% 80%,rgba(49,133,255,.10),transparent 32%),
                #05070a;
        }
        .card{
            width:100%;
            max-width:430px;
            padding:34px;
            border:1px solid rgba(255,255,255,.09);
            border-radius:24px;
            background:rgba(12,16,22,.72);
            backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            box-shadow:0 30px 80px rgba(0,0,0,.45);
        }
        .logo{
            width:52px;
            height:52px;
            margin:0 auto 22px;
            padding:7px;
            border-radius:16px;
            background:rgba(255,255,255,.05);
            border:1px solid rgba(255,255,255,.08);
        }
        .logo img{
            width:100%;
            height:100%;
            object-fit:contain;
        }
        h1{
            margin:0;
            text-align:center;
            font-size:28px;
            letter-spacing:-.8px;
        }
        .subtitle{
            margin:9px 0 30px;
            text-align:center;
            color:#7f8996;
            font-size:13px;
        }
        label{
            display:block;
            margin:0 0 8px;
            color:#aeb7c3;
            font-size:12px;
        }
        .field{
            margin-bottom:18px;
        }
        input{
            width:100%;
            height:50px;
            padding:0 15px;
            border-radius:13px;
            border:1px solid rgba(255,255,255,.09);
            outline:none;
            background:rgba(255,255,255,.035);
            color:#fff;
            font-size:14px;
            transition:.2s;
        }
        input:focus{
            border-color:rgba(49,133,255,.7);
            box-shadow:0 0 0 4px rgba(49,133,255,.08);
        }
        .row{
            display:flex;
            justify-content:flex-end;
            margin:-4px 0 20px;
        }
        a{
            color:#3185ff;
            text-decoration:none;
            font-size:12px;
        }
        button{
            width:100%;
            height:50px;
            border:0;
            border-radius:13px;
            background:#3185ff;
            color:#fff;
            font-size:13px;
            font-weight:700;
            cursor:pointer;
            transition:.2s;
        }
        button:hover{
            transform:translateY(-1px);
            box-shadow:0 10px 30px rgba(49,133,255,.22);
        }
        button:disabled{
            opacity:.7;
            cursor:wait;
            transform:none;
        }
        .message{
            display:none;
            margin-bottom:18px;
            padding:12px 14px;
            border-radius:12px;
            font-size:12px;
            line-height:1.5;
        }
        .message.error{
            display:block;
            background:rgba(255,70,70,.08);
            border:1px solid rgba(255,70,70,.16);
            color:#ff8d8d;
        }
        .message.success{
            display:block;
            background:rgba(49,133,255,.08);
            border:1px solid rgba(49,133,255,.16);
            color:#75adff;
        }
        .register{
            margin-top:24px;
            text-align:center;
            color:#707b88;
            font-size:12px;
        }
        .loading{
            display:inline-flex;
            align-items:center;
            gap:8px;
        }
        .spinner{
            width:15px;
            height:15px;
            border:2px solid rgba(255,255,255,.25);
            border-top-color:#fff;
            border-radius:50%;
            animation:spin .7s linear infinite;
        }
        @keyframes spin{
            to{transform:rotate(360deg)}
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        <img src="https://i.top4top.io/p_3925af3h26.png" alt="ReyCode">
    </div>

    <h1>Welcome back</h1>
    <div class="subtitle">Login ke ReyCode Digital</div>

    <div id="message" class="message"></div>

    <form id="loginForm">

        <div class="field">
            <label>Email</label>
            <input
                id="email"
                type="email"
                placeholder="nama@email.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="field">
            <label>Password</label>
            <input
                id="password"
                type="password"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="row">
            <a href="/forgot-password">Lupa password?</a>
        </div>

        <button id="submitButton" type="submit">
            LOGIN
        </button>

    </form>

    <div class="register">
        Belum punya akun?
        <a href="/register">Daftar sekarang</a>
    </div>

</div>

<script>
const form = document.getElementById("loginForm");
const button = document.getElementById("submitButton");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = `message ${type}`;
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.innerHTML = `
        <span class="loading">
            <span class="spinner"></span>
            Memproses...
        </span>
    `;

    message.className = "message";

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            credentials: "include",
            body: JSON.stringify({
                email,
                password
            })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Login gagal"
            );
        }

        showMessage(
            "Login berhasil. Mengalihkan...",
            "success"
        );

        setTimeout(() => {
            window.location.href = "/dashboard";
        }, 700);

    } catch (error) {
        showMessage(
            error.message || "Terjadi kesalahan",
            "error"
        );

        button.disabled = false;
        button.textContent = "LOGIN";
    }
});
</script>

</body>
</html>
